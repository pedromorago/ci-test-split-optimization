name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      # The comparison of the two measured configurations is deterministic:
      # regenerating it must give exactly the committed file.
      - name: Results match the data
        run: |
          PYTHONPATH=src python scripts/compare_configurations.py > /dev/null
          git diff --exit-code -- results/configurations.md
